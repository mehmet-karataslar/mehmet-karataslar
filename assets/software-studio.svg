<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
<title id="title">Mehmet Karataş — Yazılım Atölyesi</title>
<desc id="desc">Kod ekranı, mobil uygulama ve yapay zekâ arasında hareket eden veri; dokuz saniyede tekrarlanan fikirden ürüne animasyonu. Dekoratif bir sahnedir, canlı sistem durumu göstermez.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#102744"/><stop offset="1" stop-color="#172f4c"/></linearGradient>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#476382" opacity=".3"/></pattern>
<clipPath id="round"><rect width="960" height="430" rx="24"/></clipPath>
<style>
text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:Consolas,monospace}.label{font-size:12px;letter-spacing:1.5px;fill:#a8bfd8}.white{fill:#f4f8ff}.muted{fill:#8ba9c7}
@keyframes code{0%,8%{opacity:.2}18%,82%{opacity:1}100%{opacity:.2}}
@keyframes dash{to{stroke-dashoffset:-48}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes blink{0%,44%,56%,100%{opacity:1}50%{opacity:.1}}
@keyframes bar{0%,10%{transform:scaleX(.12)}68%,92%{transform:scaleX(1)}100%{transform:scaleX(.12)}}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes wheel{to{transform:rotate(360deg)}}
@keyframes shine{0%,100%{opacity:.25}50%{opacity:1}}
.line{animation:code 9s infinite}.flow{stroke-dasharray:5 7;animation:dash 3s linear infinite}.bot{animation:float 4s ease-in-out infinite}.eyes{animation:blink 5s infinite}.progress{transform-origin:48px 388px;animation:bar 9s ease-in-out infinite}.node{animation:pulse 3s ease-in-out infinite}.orbit{transform-origin:760px 241px;animation:wheel 20s linear infinite}
@media(prefers-reduced-motion:reduce){*{animation:none!important}animate,animateMotion{display:none}}
</style>
</defs>
<g clip-path="url(#round)">
<rect width="960" height="430" fill="url(#bg)"/><rect width="960" height="430" fill="url(#grid)"/>
<circle cx="920" cy="-30" r="190" fill="#284e75" opacity=".2"/>
<text x="36" y="37" class="label">MEHMET KARATAŞ / YAZILIM ATÖLYESİ</text>
<text x="36" y="77" font-size="29" font-weight="700" class="white">Bir fikir. Birkaç satır kod. Yeni bir ürün.</text>
<text x="36" y="103" font-size="14" fill="#adc3da">Web · Mobil · Yapay zekâ — aynı atölyede, birlikte çalışıyor.</text>
<rect x="806" y="25" width="117" height="26" rx="13" fill="#23445e"/>
<circle cx="822" cy="38" r="4" fill="#8dd6bc" class="node"/><text x="835" y="42" font-size="10" fill="#c1e9db">FİKİRDEN ÜRÜNE</text>
<!-- Code editor -->
<rect x="36" y="135" width="350" height="210" rx="13" fill="#0b1c30" stroke="#395674"/>
<path d="M49 135H373Q386 135 386 148V169H36V148Q36 135 49 135" fill="#213c58"/>
<circle cx="53" cy="152" r="4" fill="#d78880"/><circle cx="68" cy="152" r="4" fill="#d9bd7d"/><circle cx="83" cy="152" r="4" fill="#81bda9"/>
<text x="103" y="156" font-size="11" fill="#c3d4e6" class="mono">mehmet / yeni-fikir.tsx</text>
<text x="55" y="198" class="mono muted" font-size="13">01</text><text x="85" y="198" class="mono" font-size="13" fill="#92b8e9">const fikir = 'Bir ihtiyacı çöz';</text>
<g class="line" style="animation-delay:.6s"><text x="55" y="224" class="mono muted" font-size="13">02</text><text x="85" y="224" class="mono" font-size="13" fill="#c0d1e4">tasarla({ deneyim: 'anlaşılır' });</text></g>
<g class="line" style="animation-delay:1.2s"><text x="55" y="250" class="mono muted" font-size="13">03</text><text x="85" y="250" class="mono" font-size="13" fill="#a4d8c3">geliştir(['web', 'mobil', 'AI']);</text></g>
<g class="line" style="animation-delay:1.8s"><text x="55" y="276" class="mono muted" font-size="13">04</text><text x="85" y="276" class="mono" font-size="13" fill="#dbca9a">testEt(); iyileştir(); yayınla();</text></g>
<rect x="54" y="302" width="315" height="27" rx="6" fill="#17342f"/><text x="66" y="320" font-size="11" fill="#a3dac3" class="mono">✓ Bir fikir daha hayat buluyor...</text>
<rect x="333" y="265" width="7" height="15" fill="#d5e6f7" class="eyes"/>
<!-- Connections -->
<path d="M388 242H453" fill="none" stroke="#7aa7d8" stroke-width="2" class="flow"/>
<circle r="4" fill="#d9e9ff"><animateMotion path="M389 242H451" dur="2s" repeatCount="indefinite"/></circle>
<path d="M600 242H653" fill="none" stroke="#85baa9" stroke-width="2" class="flow"/>
<circle r="4" fill="#b7e0d0"><animateMotion path="M600 242H651" dur="2s" begin="1s" repeatCount="indefinite"/></circle>
<text x="403" y="226" font-size="9" fill="#a9c1dc">BUILD</text><text x="611" y="226" font-size="9" fill="#a9c1dc">SYNC</text>
<!-- Phone preview -->
<rect x="457" y="128" width="142" height="227" rx="23" fill="#dce7f4"/>
<rect x="464" y="135" width="128" height="213" rx="18" fill="#f8fbff"/>
<rect x="503" y="141" width="50" height="7" rx="3.5" fill="#a2b5ca"/>
<rect x="475" y="164" width="107" height="40" rx="9" fill="#1f4b7b"/>
<text x="486" y="181" font-size="9" fill="#bed3eb">YENİ BİR GÜN</text><text x="486" y="196" font-size="12" font-weight="bold" fill="white">Merhaba Mehmet!</text>
<rect x="475" y="215" width="50" height="44" rx="7" fill="#e4edf9"/><rect x="532" y="215" width="50" height="44" rx="7" fill="#e1f0ea"/>
<path d="M489 239L498 229L508 239M493 237V246H504V237" stroke="#54799e" stroke-width="2" fill="none"/>
<path d="M544 236L551 243L570 226" stroke="#527d69" stroke-width="2" fill="none"><animate attributeName="opacity" values=".2;1;1;.2" keyTimes="0;.4;.85;1" dur="9s" repeatCount="indefinite"/></path>
<rect x="475" y="271" width="107" height="37" rx="7" fill="#e7edf5"/>
<rect x="484" y="280" width="65" height="4" rx="2" fill="#a1b7d0"/><rect x="484" y="291" width="88" height="4" rx="2" fill="#c3d2e4"/>
<rect x="475" y="318" width="107" height="17" rx="6" fill="#2c5683"/><text x="499" y="330" font-size="8" fill="white">FİKRİ KEŞFET</text>
<!-- AI panel -->
<rect x="657" y="135" width="266" height="210" rx="13" fill="#162c43" stroke="#395674"/>
<text x="676" y="160" class="label">AKILLI ÇÖZÜMLER</text>
<g stroke="#6b96b8" stroke-width="1.4" opacity=".65"><path d="M713 205L760 184L811 205L828 245L796 284L746 293L704 259Z M713 205L796 284 M760 184L746 293 M811 205L704 259 M828 245L713 205 M746 293L811 205" fill="none"/></g>
<g fill="#a9cced"><circle cx="713" cy="205" r="5" class="node"/><circle cx="760" cy="184" r="6" class="node" style="animation-delay:.4s"/><circle cx="811" cy="205" r="5" class="node" style="animation-delay:.8s"/><circle cx="828" cy="245" r="5" class="node" style="animation-delay:1.2s"/><circle cx="796" cy="284" r="5" class="node" style="animation-delay:1.6s"/><circle cx="746" cy="293" r="5" class="node" style="animation-delay:2s"/><circle cx="704" cy="259" r="5" class="node" style="animation-delay:2.4s"/></g>
<g class="orbit"><ellipse cx="760" cy="241" rx="24" ry="54" stroke="#adc9e4" stroke-width="1" fill="none" opacity=".4"/><circle cx="760" cy="187" r="3" fill="#c2ddf5"/></g>
<circle cx="760" cy="241" r="23" fill="#2b5278"/><text x="760" y="246" text-anchor="middle" font-size="14" fill="#e5efff" font-weight="bold">AI</text>
<!-- playful robot -->
<g class="bot"><path d="M866 220V212" stroke="#98b8d5" stroke-width="2"/><circle cx="866" cy="209" r="3" fill="#a4d8c3"/><rect x="847" y="220" width="39" height="30" rx="9" fill="#d4e2f0"/><g class="eyes" fill="#234869"><circle cx="858" cy="232" r="3"/><circle cx="875" cy="232" r="3"/></g><path d="M862 241Q867 245 872 241" stroke="#476a88" stroke-width="1.5" fill="none"/><rect x="854" y="253" width="25" height="17" rx="5" fill="#aec4d9"/><path d="M850 255L844 259M883 255L890 249" stroke="#b9cfdf" stroke-width="3" stroke-linecap="round"/></g>
<text x="680" y="325" font-size="11" fill="#a9c1d9">Python · Görüntü işleme · Otomasyon</text>
<!-- Cycle timeline -->
<rect x="36" y="371" width="887" height="38" rx="10" fill="#0c2036"/>
<rect x="48" y="386" width="155" height="4" rx="2" fill="#294762"/><rect x="48" y="386" width="155" height="4" rx="2" fill="#9bbce2" class="progress"/>
<text x="226" y="395" font-size="12" fill="#c8d8e9">01 Fikir</text><text x="345" y="395" font-size="12" fill="#c8d8e9">02 Tasarım</text><text x="490" y="395" font-size="12" fill="#c8d8e9">03 Kod</text><text x="608" y="395" font-size="12" fill="#c8d8e9">04 Test</text><text x="723" y="395" font-size="12" fill="#a8d9c6">05 Ürün</text><text x="831" y="395" font-size="10" fill="#7898b8">TEKRAR ↻</text>
</g>
</svg>
