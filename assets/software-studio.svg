<style>
text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:Consolas,'Courier New',monospace}.small{font-size:11px}.ink{fill:#423127}.sub{fill:#8d7363}
@keyframes reveal{0%,6%{opacity:0}18%,88%{opacity:1}100%{opacity:0}}@keyframes blink{0%,45%,100%{opacity:1}50%,90%{opacity:0}}@keyframes dash{to{stroke-dashoffset:-42}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes rotate{to{transform:rotate(360deg)}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes grow{0%,10%{transform:scaleX(.2)}70%,90%{transform:scaleX(1)}100%{transform:scaleX(.2)}}
