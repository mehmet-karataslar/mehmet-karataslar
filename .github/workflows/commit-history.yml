name: Update commit history
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    paths:
      - '.github/workflows/commit-history.yml'
permissions:
  contents: write
concurrency:
  group: profile-commit-history
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Read actual GitHub commits
        env:
          PROFILE_LOGIN: mehmet-karataslar
          GH_API_TOKEN: ${{ secrets.PROFILE_GITHUB_TOKEN || github.token }}
          HAS_PROFILE_TOKEN: ${{ secrets.PROFILE_GITHUB_TOKEN != '' }}
        run: |
          python3 - <<'PYTHON'
          import os, json, time, urllib.request, urllib.parse, urllib.error, html
          from pathlib import Path
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          
          login = os.environ['PROFILE_LOGIN']
          token = os.environ['GH_API_TOKEN']
          now = datetime.now(ZoneInfo('Europe/Istanbul'))
          
          # Search has a separate, restrictive rate limit. Pace every request.
          last_request = None

          def search(query, per_page=1):
              global last_request
              url = 'https://api.github.com/search/commits?' + urllib.parse.urlencode({'q': query, 'sort': 'committer-date', 'order': 'desc', 'per_page': per_page})
              for attempt in range(5):
                  if last_request is not None:
                      time.sleep(max(0, 7 - (time.monotonic() - last_request)))
                  req = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'profile-commit-history'})
                  last_request = time.monotonic()
                  try:
                      with urllib.request.urlopen(req, timeout=45) as response:
                          data = json.load(response)
                      if not data.get('incomplete_results'):
                          return data
                      reason = 'GitHub returned incomplete search results'
                      delay = 5 * 2 ** attempt
                  except urllib.error.HTTPError as error:
                      if error.code not in (403, 429, 500, 502, 503, 504):
                          raise
                      reason = f'GitHub API HTTP {error.code}'
                      delay = 60 * 2 ** attempt if error.code in (403, 429) else 5 * 2 ** attempt
                      retry_after = error.headers.get('Retry-After')
                      if retry_after:
                          delay = max(delay, float(retry_after))
                      if error.headers.get('X-RateLimit-Remaining') == '0':
                          delay = max(delay, float(error.headers.get('X-RateLimit-Reset', 0)) - time.time() + 2)
                  except (urllib.error.URLError, TimeoutError, ConnectionError) as error:
                      reason = f'GitHub connection error: {type(error).__name__}'
                      delay = 5 * 2 ** attempt
                  if attempt == 4 or delay > 300:
                      raise RuntimeError(reason + '; keeping the last successful SVG data')
                  print(f'{reason}; retry {attempt + 1}/4 in {delay:.0f}s', flush=True)
                  time.sleep(delay)

          all_commits = search('author:' + login)
          total = all_commits['total_count']
          months = []
          month_index = now.year * 12 + now.month - 1
          for delta in range(11, -1, -1):
              index = month_index - delta
              year, zero_month = divmod(index, 12)
              start = datetime(year, zero_month + 1, 1)
              next_index = index + 1
              next_year, next_zero_month = divmod(next_index, 12)
              end = datetime(next_year, next_zero_month + 1, 1) - timedelta(days=1)
              count = search(f'author:{login} committer-date:{start:%Y-%m-%d}..{end:%Y-%m-%d}')['total_count']
              months.append((start.strftime('%m/%y'), count))
          
          scope = 'Yetkilendirilmiş commit kayıtları' if os.environ.get('HAS_PROFILE_TOKEN') == 'true' else 'Herkese açık commit kayıtları'
          def esc(s):
              return html.escape(str(s), quote=True)
          
          import re
          for filename, dark in [('github-hero.svg', False), ('github-hero-dark.svg', True)]:
              path = Path(filename)
              if not path.exists():
                  continue
              content = path.read_text(encoding='utf-8')
              ink = '#f0e8df' if dark else '#503c2d'
              muted = '#a99786' if dark else '#99826b'
              parts = ['<g id="actual-commit-summary">', f'<text x="619" y="54" font-size="11" font-weight="bold" fill="{muted}">COMMIT GEÇMİŞİM</text>', f'<text x="619" y="97" font-size="35" font-weight="bold" fill="{ink}">{total:,}</text>', f'<text x="765" y="82" font-size="11" fill="{muted}">{esc(scope)}</text>', f'<text x="765" y="100" font-size="10" fill="{muted}">6 saatte bir otomatik güncelleme</text>']
              maximum = max(1, max(n for _,n in months))
              for i,(label,count) in enumerate(months):
                  x = 621+i*34
                  height = max(2, round(count/maximum*39))
                  parts.append(f'<rect x="{x}" y="{155-height}" width="23" height="{height}" rx="3" fill="#e98a5f"><title>{label}: {count} commit</title></rect>')
              parts.append(f'<text x="619" y="171" font-size="9" fill="{muted}">Son 12 ay · Güncelleme: {now:%d.%m.%Y %H:%M}</text></g>')
              block = ''.join(parts)
              if 'id="actual-commit-summary"' in content:
                  content = re.sub(r'<g id="actual-commit-summary">[\s\S]*?</g>', lambda m: block, content)
              else:
                  start = content.find('<text class="m" x="619"')
                  end = content.find('<g filter=', start)
                  if start == -1 or end == -1:
                      raise RuntimeError('Cannot locate banner contribution panel')
                  content = content[:start] + block + content[end:]
              content = content.replace('Canlı katkı haritası', 'Gerçek commit geçmişi').replace('git log --graph --oneline', 'git akışı — şematik animasyon')
              content = re.sub(r'<metadata>[\s\S]*?</metadata>', '', content)
              path.write_text(content, encoding='utf-8')
          print('Commit history updated:', total, 'commits')
          PYTHON
      - name: Save updated history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add github-hero.svg github-hero-dark.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Update GitHub commit history'
            git pull --rebase
            git push
          fi
